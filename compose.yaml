name: unifi-camera-bridge
services:
  manager:
    image: local/unifi-camera-bridge:1.6.5
    build: .
    container_name: unifi-camera-bridge
    restart: unless-stopped
    init: true
    read_only: true
    user: '65532:65532'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    pids_limit: 512
    volumes:
      - camera-settings:/data
    tmpfs:
      - /run/bridge:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
      - /tmp:rw,noexec,nosuid,size=32m,uid=65532,gid=65532,mode=0700
    ports:
      # Admin UI defaults to local access. Use a trusted LAN bind IP for remote access.
      - '${ADMIN_BIND_IP:-127.0.0.1}:8080:8080'
      # ONVIF and RTSP ports match advertised ports, one pair per lens.
      - '8100-8115:8100-8115/tcp'
      - '8600-8615:8600-8615/tcp'
    environment:
      ENDPOINT_CAPACITY: '16'
      ONVIF_PORT_BASE: '8100'
      RTSP_PORT_BASE: '8600'
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  camera-settings:
    name: unifi-camera-bridge-data
