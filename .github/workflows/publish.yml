name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release and derive image name
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r"^VERSION = '([^']+)'",Path('manager.py').read_text(),re.M)[1]
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version) or os.environ['RELEASE_TAG']!='v'+version:
              raise SystemExit('Release tag must equal v plus the stable application version.')
          image='ghcr.io/'+os.environ['REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+version+'\nimage='+image+'\n')
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish numbered release for both CPUs
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}
            REVISION=${{ github.sha }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both published architectures
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          python3 - <<'PY'
          import json
          manifest=json.load(open('manifest.json'))
          images={m['platform']['architecture']:m['digest'] for m in manifest['manifests'] if m['platform']['os']=='linux'}
          assert {'amd64','arm64'} <= images.keys(), images
          with open('platform-images.tsv','w') as f:
              for arch in ('amd64','arm64'):
                  f.write(arch+'\t'+images[arch]+'\n')
          PY
          # The classic Docker image store cannot hold both platforms under one
          # index digest. Check each exact child manifest from the built index.
          while IFS=$'\t' read -r arch platform_digest; do
            python3 scripts/check-image.py "$IMAGE@$platform_digest" --platform "linux/$arch" --version "${{ steps.release.outputs.version }}"
          done < platform-images.tsv
      - name: Promote verified image to stable
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@$DIGEST"
      - name: Create Debian installer and Compose downloads
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          python3 scripts/package-registry-installer.py --image "$IMAGE:stable" dist
          python3 scripts/package-registry-compose.py --image "$IMAGE:stable" dist
      - name: Attach installation files to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Unifi Camera Bridge $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 dist/*.yaml --clobber
